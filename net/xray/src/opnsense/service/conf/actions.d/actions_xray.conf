[start]
command:/usr/local/etc/rc.d/xray start
parameters:
type:script
message:starting xray-core

[stop]
command:/usr/local/etc/rc.d/xray stop
parameters:
type:script
message:stopping xray-core

[restart]
command:/usr/local/etc/rc.d/xray restart
parameters:
type:script
message:restarting xray-core

[status]
command:/usr/local/etc/rc.d/xray status
errors:no
parameters:
type:script_output
message:request xray-core status

[reload]
command:/usr/local/etc/rc.d/xray restart
parameters:
type:script
message:reloading xray-core

[reconfigure]
command:/usr/local/opnsense/scripts/xray/apply.py
parameters:
type:script_output
message:reconfiguring xray-core (regenerate confdir and restart)

[test]
command:/usr/local/bin/xray run -test -confdir /usr/local/etc/xray/conf.d
parameters:
type:script_output
message:testing xray-core configuration

[version]
command:/usr/local/bin/xray version
parameters:
type:script_output
message:request xray-core version

[geosite_list]
command:/usr/local/opnsense/scripts/xray/geosite_list.py --json
parameters:
type:script_output
message:listing geosite.dat categories

[subscription_update]
command:/usr/local/opnsense/scripts/xray/subscription.py --update-all
parameters:%s
type:script_output
message:updating xray subscriptions
